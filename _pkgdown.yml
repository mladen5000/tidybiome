url: https://tidybiome.org/

template:
  bootstrap: 5
  bootswatch: flatly

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [github]
  components:
    intro:
      text: Get Started
      href: articles/introduction_to_tidybiome.html
    articles:
      text: Articles
      menu:
        - text: "Getting Started with tidybiome"
          href: articles/introduction_to_tidybiome.html
        - text: "Statistical Rigor and Ecological Modeling"
          href: articles/statistical_rigor_and_ecology.html
        - text: "Bioconductor Interoperability (TreeSE & mia)"
          href: articles/bioconductor_interoperability.html

reference:
  - title: "Pipeline Ingestion & Import"
    desc: "Ingest outputs from DADA2, QIIME 2, and MetaPhlAn pipelines."
    contents:
      - import_dada2
      - import_qiime2
      - import_metaphlan

  - title: "Container & Data Wrangling"
    desc: "Creating, subsetting, and validating tidy_microbiome objects."
    contents:
      - tidy_microbiome
      - summary.tidy_microbiome
      - filter_taxa
      - validate_tidy_microbiome
      - tidy_abundance
      - tidy_taxa
      - assay
      - tax_table
      - aggregate_taxa

  - title: "Transformations & Normalization"
    desc: "Compositional and sequencing depth standardizations."
    contents:
      - transform_abundance
      - calc_gmpr_size_factors

  - title: "Sample Quality Control & Diagnostics"
    desc: "Per-sample library depth, feature richness, sparsity, and diagnostic plots."
    contents:
      - calc_qc_metrics
      - plot_qc

  - title: "Diversity & Distance Metrics"
    desc: "Unified alpha diversity profiles and beta diversity dissimilarities."
    contents:
      - calc_alpha_diversity
      - calc_beta_diversity
      - calc_unifrac
      - get_distance
      - dth_test

  - title: "Dimensionality Reduction & Ordination"
    desc: "RPCA biplots, contrastive PCA, NMDS, and db-RDA."
    contents:
      - calc_ordination
      - get_ordination
      - run_dbrda
      - run_nmds

  - title: "Differential Abundance"
    desc: "Consensus and multi-engine biomarker discovery with formulas and covariates."
    contents:
      - calc_differential_abundance

  - title: "Ecological Screening, Networks & Core Microbiome"
    desc: "Prevalence, dominance, divergence, cross-associations, and co-occurrence graphs."
    contents:
      - calc_prevalence
      - filter_prevalent
      - calc_dominant
      - calc_divergence
      - calc_cross_association
      - calc_network
      - calc_core_microbiome

  - title: "Ecosystem Interoperability Bridges"
    desc: "Connectors to vegan, phyloseq, mia, S7, and ape."
    contents:
      - to_vegan
      - from_vegan
      - run_permanova
      - run_betadisper
      - to_phyloseq
      - to_tse
      - to_s7
      - from_s7
      - as_tidybiome
      - set_tree
      - get_tree

  - title: "Publication-Grade Visualizations & Dashboards"
    desc: "High-aesthetic ggplot2 extensions and standalone HTML dashboards."
    contents:
      - plot_composition
      - plot_heatmap
      - plot_ordination
      - plot_alpha
      - plot_da_volcano
      - plot_dbrda
      - plot_network
      - plot_core
      - plot_qc
      - report_tidybiome
      - theme_tidybiome
      - tidybiome_pal

  - title: "Example Datasets"
    desc: "Built-in demonstration datasets."
    contents:
      - gut_microbiome
